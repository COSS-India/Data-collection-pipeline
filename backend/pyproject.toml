[project]
name = "dcp"
version = "0.1.0"
description = "Data collection pipeline: extract text from files, split into sentences, classify metadata"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "charset-normalizer>=3.3",
    "odfpy>=1.4",
    "ebooklib>=0.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
dcp = "dcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcp"]
