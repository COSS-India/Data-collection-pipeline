# Pipeline settings. Relative paths are resolved against the project root
# (the parent of this configs/ directory), not the current working directory.

data_dir: data          # intermediate stage outputs
output_dir: output      # final corpus + report
sources_file: configs/sources.yaml

workers: 8              # CPU processes for clean / split
ingest_threads: 8       # parallel parquet files during ingest

filter:
  min_words: 3            # sentences shorter than this are dropped
  max_words: 200          # unsplittable sentences longer than this are dropped (protects the LLM context)
  min_devanagari_ratio: 0.8   # share of letters that must be Devanagari

split:
  unsplit_long_words: 40  # a row with no sentence punctuation and more words than this is tagged unsplit_long

length_buckets:           # inclusive upper bounds in words; above long_max -> very_long
  short_max: 8
  medium_max: 20
  long_max: 40

classify:
  base_url: http://127.0.0.1:8000/v1
  model: google/gemma-4-26B-A4B-it
  shard_size: 50000
  concurrency: 256        # total requests in flight, split across client processes
  client_processes: 4     # HTTP client processes (one Python process tops out at ~300 req/s)
  max_tokens: 5
  timeout_s: 120
  max_retries: 5
  # document filter (sources with doc_filter: true): spread read of each document
  doc_excerpt_words: 200    # words shown to the model: the opening + evenly spaced sentences
  doc_head_words: 100       # of which from the start of the document
  doc_keep_threshold: 0.2   # keep a doc if labelled AGRI or P(AGRI) >= this (recall-leaning)

report:
  target_agri_sentences: 200000
  samples_per_label: 200
  seed: 42
