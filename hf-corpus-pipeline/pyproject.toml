[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marathi-agri"
version = "0.1.0"
description = "Build a Marathi agriculture sentence corpus from Hugging Face datasets, classified with Gemma 4 26B A4B on vLLM."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "huggingface_hub>=0.30",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
serve = ["vllm==0.33.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
marathi-agri = "marathi_agri.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Devanagari / typographic chars are intentional

[tool.ruff.lint.per-file-ignores]
"src/marathi_agri/prompt.py" = ["E501"]  # prompt text is kept verbatim
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
